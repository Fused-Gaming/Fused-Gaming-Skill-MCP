name: 📦 Create Release Issue & Benchmark Tracking

on:
  push:
    tags:
      - 'v*'           # Release tag: v1.0.0, v1.1.0, etc.
      - 'skill-*@*'    # Skill tag: skill-design-system@1.0.0

jobs:
  create-release-issue:
    name: Create Release Issue & Benchmark Tracking
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Extract package information from tag
        id: package-info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Parse tag format: v1.0.0 (root) or skill-design-system@1.0.0 (skill)
          if [[ $TAG == v* ]]; then
            PACKAGE="@h4shed/mcp-core"
            VERSION="${TAG#v}"
            RELEASE_TYPE="root"
          elif [[ $TAG == skill-* ]]; then
            # Extract skill name and version from skill-name@version format
            SKILL_NAME=$(echo $TAG | sed 's/@.*//' | sed 's/skill-//')
            VERSION=$(echo $TAG | sed 's/.*@//')
            PACKAGE="@h4shed/skill-$SKILL_NAME"
            RELEASE_TYPE="skill"
          else
            echo "Unrecognized tag format: $TAG"
            exit 1
          fi

          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Run benchmark tests
        id: benchmarks
        run: |
          RESULTS_FILE="benchmarks/packages/${{ steps.package-info.outputs.package }}/v${{ steps.package-info.outputs.version }}/results-${{ github.run_number }}.json"
          mkdir -p "$(dirname "$RESULTS_FILE")"

          BENCHMARK_SUCCESS=false
          if npm run benchmark --workspace=${{ steps.package-info.outputs.package }} > benchmark-output.log 2>&1; then
            BENCHMARK_SUCCESS=true
            if [ -f "benchmarks/packages/${{ steps.package-info.outputs.package }}/latest/results.json" ]; then
              cp "benchmarks/packages/${{ steps.package-info.outputs.package }}/latest/results.json" "$RESULTS_FILE"
            fi
          fi

          if [ "$BENCHMARK_SUCCESS" = false ] || [ ! -f "$RESULTS_FILE" ]; then
            cat > "$RESULTS_FILE" <<EOF
          {
            "package": "${{ steps.package-info.outputs.package }}",
            "version": "${{ steps.package-info.outputs.version }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "behavioral": {
              "core_pass_rate": 0,
              "core_total": 0,
              "regression_pass_rate": 0,
              "regression_total": 0,
              "functionality_pass_rate": 0,
              "functionality_total": 0,
              "error_pass_rate": 0,
              "error_total": 0,
              "behavioral_score": 0
            },
            "performance": {
              "latency_ms_mean": 0,
              "latency_ms_std_dev": 0,
              "throughput_ops_sec_mean": 0,
              "throughput_ops_sec_std_dev": 0,
              "memory_mb_peak": 0,
              "performance_score": 0
            },
            "code_quality": {
              "complexity_mean": 0,
              "complexity_max": 0,
              "duplication_percent": 0,
              "coverage_percent": 0,
              "maintainability_index": 0,
              "quality_score": 0
            },
            "combined_score": 0,
            "status": "fail"
          }
          EOF
          fi

          echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.package-info.outputs.package }}-${{ steps.package-info.outputs.version }}
          path: ${{ steps.benchmarks.outputs.results_file }}
          retention-days: 90

      - name: Create GitHub Release Issue
        id: create-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_ASSIGNEE: ${{ github.actor }}
        run: |
          npx ts-node scripts/create-release-issue.ts \
            "${{ steps.package-info.outputs.package }}" \
            "${{ steps.package-info.outputs.version }}" \
            "${{ steps.benchmarks.outputs.results_file }}"

      - name: Generate benchmark report
        run: |
          REPORT_DIR="benchmarks/packages/${{ steps.package-info.outputs.package }}/v${{ steps.package-info.outputs.version }}"
          mkdir -p "$REPORT_DIR"
          cp ${{ steps.benchmarks.outputs.results_file }} "$REPORT_DIR/results.json"

          cat > "$REPORT_DIR/index.html" <<'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Benchmark Report</title>
            <style>
              body { font-family: sans-serif; margin: 20px; }
              .metric { display: inline-block; margin: 10px; padding: 15px; border-radius: 8px; background: #f5f5f5; }
              .score { font-size: 2em; font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Benchmark Report</h1>
            <div id="results"></div>
            <script>
              fetch('results.json').then(r => r.json()).then(data => {
                const html = `
                  <h2>${data.package} v${data.version}</h2>
                  <div class="metric">
                    <div class="score">${data.combined_score.toFixed(1)}%</div>
                    <div>Combined Score</div>
                  </div>
                `;
                document.getElementById('results').innerHTML = html;
              });
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Update packages registry
        run: |
          mkdir -p benchmarks

          REGISTRY=$(cat benchmarks/packages-registry.json 2>/dev/null || echo '{"packages":{},"versions":[]}')

          echo "$REGISTRY" | jq \
            --arg pkg "${{ steps.package-info.outputs.package }}" \
            --arg ver "${{ steps.package-info.outputs.version }}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.packages[$pkg] |= . + {
              "name": $pkg,
              "latest_version": $ver,
              "updated": $date
            } |
            .versions += [{
              "package": $pkg,
              "version": $ver,
              "status": "released",
              "timestamp": $date
            }] |
            .meta.updated = $date' > benchmarks/packages-registry.json.tmp

          mv benchmarks/packages-registry.json.tmp benchmarks/packages-registry.json

      - name: Commit benchmark results to main
        if: github.actor != 'dependabot[bot]'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add benchmarks/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(benchmarks): record results for ${{ steps.package-info.outputs.package }} v${{ steps.package-info.outputs.version }}"
            git push origin main
          fi
