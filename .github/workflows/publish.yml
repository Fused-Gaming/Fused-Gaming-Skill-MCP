name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "skill-*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Configure Git user for signed commits
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global commit.gpgsign false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        if: env.HAS_GPG_PRIVATE_KEY == 'true'
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_committer_name: github-actions[bot]
          git_committer_email: github-actions[bot]@users.noreply.github.com
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Prepare workspace publish versions
        run: node scripts/prepare-publish-versions.cjs

      - name: Auto-bump workspace versions for npm publish
        run: node scripts/auto-bump-publish-versions.js

      - name: Sync package-lock.json after version bumps
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Prepare package scope for publishing
        run: |
          if [ -z "${NPM_SCOPE}" ]; then
            export NPM_SCOPE=$(node -e "console.log(require('./VERSION.json').packageInfo.publishedScope)")
          fi
          echo "Publishing with scope: @${NPM_SCOPE}"
          node scripts/prepare-publish-scope.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}

      - name: Preflight publish version check
        run: node scripts/preflight-publish-check.js

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

      - name: Validate benchmarks (pre-publication gate)
        if: success()
        run: |
          # Determine which packages to validate
          # Discover all workspace packages including nested skills
          PACKAGES_TO_VALIDATE=$(node -e "
            const fs = require('fs');
            const path = require('path');

            function findPackages(dir) {
              const packages = [];
              try {
                const entries = fs.readdirSync(dir, { withFileTypes: true });
                entries.forEach(entry => {
                  const fullPath = path.join(dir, entry.name);
                  const pkgJsonPath = path.join(fullPath, 'package.json');

                  if (entry.isDirectory() && fs.existsSync(pkgJsonPath)) {
                    try {
                      const pkg = JSON.parse(fs.readFileSync(pkgJsonPath, 'utf8'));
                      packages.push(pkg.name);
                    } catch (e) {
                      // Skip malformed package.json
                    }
                  }
                });
              } catch (e) {
                // Skip if directory doesn't exist
              }
              return packages;
            }

            // Find all packages in packages/ and packages/skills/
            const packages = [
              ...findPackages('packages'),
              ...findPackages('packages/skills')
            ];

            console.log([...new Set(packages)].join(' '));
          ")

          VALIDATION_FAILED=false

          for PACKAGE in $PACKAGES_TO_VALIDATE; do
            echo "Validating benchmarks for: $PACKAGE"

            # Get workspace-specific version from the package's own package.json, not root
            # npm ls -p outputs repo root first, then workspace paths - we want the last line
            WORKSPACE_ROOT=$(npm ls -p --workspace=$PACKAGE 2>/dev/null | tail -1)
            if [ -z "$WORKSPACE_ROOT" ]; then
              echo "❌ Could not determine workspace root for $PACKAGE"
              VALIDATION_FAILED=true
              continue
            fi
            WORKSPACE_VERSION=$(jq -r '.version' "$WORKSPACE_ROOT/package.json" 2>/dev/null || echo "0.0.0")

            # Run benchmark
            RESULTS_DIR="benchmarks/packages/$PACKAGE/v$WORKSPACE_VERSION"
            mkdir -p "$RESULTS_DIR"

            if npm run benchmark --workspace=$PACKAGE > benchmark-output.log 2>&1; then
              # Prefer the DoD report a real benchmark harness (BehavioralTester /
              # PerformanceBenchmarker / DoDScorer from @h4shed/benchmark-utils) writes to
              # <workspace>/.benchmark/results.json — reading that file is reliable, unlike
              # scraping the JSON that a script happens to print to stdout (multi-line pretty
              # JSON containing nested "}" lines cannot be reliably located with a regex).
              # Packages whose "benchmark" script is still a no-op and never write that file
              # get an honest 'not_measured' status instead of a fake zero 'conditional' score,
              # so they don't generate a misleading "combined score 0% < 90%" warning on every
              # publish.
              node -e "
                const fs = require('fs');

                let measured = null;
                const measuredPath = '$WORKSPACE_ROOT/.benchmark/results.json';
                if (fs.existsSync(measuredPath)) {
                  try {
                    const candidate = JSON.parse(fs.readFileSync(measuredPath, 'utf8'));
                    if (typeof candidate.combined_score === 'number') measured = candidate;
                  } catch {
                    // not valid JSON, treat as not measured
                  }
                }

                const results = measured ? {
                  package: '$PACKAGE',
                  version: '$WORKSPACE_VERSION',
                  timestamp: new Date().toISOString(),
                  ...measured,
                  status: measured.status || (measured.combined_score >= 90 ? 'pass' : 'fail'),
                } : {
                  package: '$PACKAGE',
                  version: '$WORKSPACE_VERSION',
                  timestamp: new Date().toISOString(),
                  behavioral: { core_pass_rate: 0, core_total: 0, regression_pass_rate: 0, regression_total: 0, functionality_pass_rate: 0, functionality_total: 0, error_pass_rate: 0, error_total: 0, behavioral_score: 0 },
                  performance: { latency_ms_mean: 0, latency_ms_std_dev: 0, latency_sample_count: 0, throughput_ops_sec_mean: 0, throughput_ops_sec_std_dev: 0, throughput_sample_count: 0, memory_mb_peak: 0, performance_score: 0 },
                  code_quality: { complexity_mean: 0, complexity_max: 0, duplication_percent: 0, coverage_percent: 0, maintainability_index: 0, quality_score: 0 },
                  combined_score: 0,
                  status: 'not_measured'
                };

                console.log(JSON.stringify(results, null, 2));
              " > "$RESULTS_DIR/results.json"
              echo "✅ Benchmark completed for $PACKAGE"
            else
              # Benchmark command failed (missing script, execution error, etc.)
              echo "❌ Benchmark validation failed for $PACKAGE (exit code: $?)"
              VALIDATION_FAILED=true

              # Still write results file for tracking, but mark as failed
              node -e "
                const fs = require('fs');
                fs.writeFileSync('$RESULTS_DIR/results.json', JSON.stringify({
                  package: '$PACKAGE',
                  version: '$WORKSPACE_VERSION',
                  timestamp: new Date().toISOString(),
                  behavioral: { core_pass_rate: 0, core_total: 0, regression_pass_rate: 0, regression_total: 0, functionality_pass_rate: 0, functionality_total: 0, error_pass_rate: 0, error_total: 0, behavioral_score: 0 },
                  performance: { latency_ms_mean: 0, latency_ms_std_dev: 0, latency_sample_count: 0, throughput_ops_sec_mean: 0, throughput_ops_sec_std_dev: 0, throughput_sample_count: 0, memory_mb_peak: 0, performance_score: 0 },
                  code_quality: { complexity_mean: 0, complexity_max: 0, duplication_percent: 0, coverage_percent: 0, maintainability_index: 0, quality_score: 0 },
                  combined_score: 0,
                  status: 'fail'
                }, null, 2));
              "
            fi
          done

          # Warning if any validation failed (non-blocking)
          if [ "$VALIDATION_FAILED" = true ]; then
            echo "⚠️  Warning: Benchmark validation failed for one or more packages (continuing with publish)"
          else
            echo "✅ All benchmark validations completed successfully"
          fi

          # Validate combined scores meet DoD threshold (>= 90%) - warning only.
          # Packages with status 'not_measured' have no real benchmark data collected
          # (their benchmark script is a placeholder) and are reported as informational
          # only — they must not generate a spurious "0% < 90%" warning on every release.
          SCORE_VALIDATION_FAILED=false
          for PACKAGE in $PACKAGES_TO_VALIDATE; do
            WORKSPACE_VERSION=$(jq -r '.version' <(npm ls -p --workspace=$PACKAGE 2>/dev/null | tail -1 | xargs -I {} test -f {}/package.json && cat {}/package.json) 2>/dev/null || echo "0.0.0")
            RESULTS_FILE="benchmarks/packages/$PACKAGE/v$WORKSPACE_VERSION/results.json"

            if [ -f "$RESULTS_FILE" ]; then
              STATUS=$(jq -r '.status // "not_measured"' "$RESULTS_FILE" 2>/dev/null)
              COMBINED_SCORE=$(jq -r '.combined_score // 0' "$RESULTS_FILE" 2>/dev/null)

              if [ "$STATUS" = "not_measured" ]; then
                echo "ℹ️  $PACKAGE v$WORKSPACE_VERSION: benchmarks not collected (no DoD report emitted); skipping score gate"
              elif (( $(echo "$COMBINED_SCORE < 90" | bc -l) )); then
                echo "⚠️  Warning: $PACKAGE v$WORKSPACE_VERSION: Combined score $COMBINED_SCORE% < 90% threshold"
                SCORE_VALIDATION_FAILED=true
              else
                echo "✅ $PACKAGE v$WORKSPACE_VERSION: Combined score $COMBINED_SCORE% >= 90%"
              fi
            fi
          done

          if [ "$SCORE_VALIDATION_FAILED" = true ]; then
            echo "⚠️  Warning: Benchmark score validation failed for some packages (continuing with publish)"
          fi

          echo "✅ Benchmark validation completed (non-blocking - publish will continue)"

      - name: Commit and sign version updates
        if: success() && !startsWith(github.ref, 'refs/tags/') && env.HAS_GPG_PRIVATE_KEY == 'true'
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -S -m $'chore: bump versions for publish\n\n- Updated workspace versions\n- Refreshed package-lock.json\n- Automated by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' || true
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create signed tag
        if: success() && !startsWith(github.ref, 'refs/tags/') && env.HAS_GPG_PRIVATE_KEY == 'true'
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v${VERSION}"
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag -s "${TAG}" -m $'Release version '"${VERSION}"$'\n\nAutomated publish workflow from branch: ${{ github.ref_name }}\nBuild: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            git push origin "${TAG}"
            echo "Created and pushed signed tag: ${TAG}"
          else
            echo "Tag ${TAG} already exists"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workspaces to npm
        run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Published Packages

            Published to npm registry with GPG signed commit and tag.

            **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Publish complete notification
        if: success()
        run: |
          echo "✅ Publish workflow completed successfully"
          echo "📦 Packages published to npm registry"
          echo "🔐 Commits and tags signed with GPG"
          echo "🏷️ Release: ${{ github.ref_name }}"
