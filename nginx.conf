user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream servers
    upstream sync_coordinator {
        server sync-coordinator:3002;
        keepalive 32;
    }

    upstream skill_repository {
        server skill-repository:3003;
        keepalive 32;
    }

    # HTTP redirect to HTTPS (if SSL configured)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS for Sync Coordinator
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name sync.vln.gg localhost;

        # SSL configuration (update paths as needed)
        ssl_certificate /etc/nginx/certs/sync.crt;
        ssl_certificate_key /etc/nginx/certs/sync.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /mcp {
            limit_req zone=api burst=50 nodelay;

            # Proxy settings
            proxy_pass http://sync_coordinator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Connection settings
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # SSE/streaming settings
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;

            # Headers for SSE
            proxy_set_header Accept-Encoding "";
        }

        location /mcp/health {
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://sync_coordinator;
            access_log off;
        }
    }

    # HTTPS for Skill Repository
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name skill.vln.gg localhost;

        # SSL configuration (update paths as needed)
        ssl_certificate /etc/nginx/certs/skill.crt;
        ssl_certificate_key /etc/nginx/certs/skill.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /mcp {
            limit_req zone=api burst=50 nodelay;

            # Proxy settings
            proxy_pass http://skill_repository;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Connection settings
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # SSE/streaming settings
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;

            # Headers for SSE
            proxy_set_header Accept-Encoding "";
        }

        location /mcp/health {
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://skill_repository;
            access_log off;
        }
    }

    # Local development without SSL (for development only)
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location /sync {
            proxy_pass http://sync_coordinator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
        }

        location /skills {
            proxy_pass http://skill_repository;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
